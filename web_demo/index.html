    // Hệ thống âm thanh Web Audio API + Giọng đọc tiếng Việt
    let audioCtx = null;
    function playTone(freq, duration = 0.12, type = "sine", vol = 0.15) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function sfxClick() { playTone(660, 0.09, "triangle", 0.16); }
    function sfxCorrect() {
      playTone(523.25, 0.1, "triangle", 0.18);
      setTimeout(() => playTone(659.25, 0.1, "triangle", 0.18), 90);
      setTimeout(() => playTone(783.99, 0.22, "triangle", 0.2), 180);
    }
    function sfxWrong() {
      playTone(260, 0.15, "sawtooth", 0.14);
      setTimeout(() => playTone(210, 0.22, "sawtooth", 0.14), 130);
    }
    function speakVietnamese(text) {
      if (!state.soundEnabled || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "vi-VN";
        u.rate = 1.02;

    // Các hàm vẽ UI & Chữ tiếng Việt sắc nét
    function drawTextOutlined(text, x, y, fontPx, fill = "#ffffff", outline = "#0b2454", align = "center", baseline = "middle") {
      ctx.save();
      ctx.font = `800 ${fontPx}px "Segoe UI", Tahoma, Arial, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.lineJoin = "round";
      ctx.miterLimit = 2;

      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillText(text, x + 2, y + 3);

      ctx.lineWidth = Math.max(4, Math.round(fontPx * 0.22));
      ctx.strokeStyle = outline;
      ctx.strokeText(text, x, y);

      ctx.fillStyle = fill;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawWrappedText(text, x, y, maxWidth, lineHeight, fontPx, fill = "#ffffff", outline = "#0b2454", align = "center") {
      ctx.save();
      ctx.font = `700 ${fontPx}px "Segoe UI", Tahoma, Arial, sans-serif`;
      const words = text.split(" ");
      const lines = [];
      let currentLine = words[0] || "";

      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = ctx.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      ctx.restore();

      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      for (let i = 0; i < lines.length; i++) {
        drawTextOutlined(lines[i], x, startY + i * lineHeight, fontPx, fill, outline, align, "middle");
      }
    }

    function drawRoundRect(x1, y1, x2, y2, r, fillStyle, strokeStyle, lineWidth = 2) {
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(x1, y1, x2 - x1, y2 - y1, r);
      if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
      if (strokeStyle) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = strokeStyle;
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawHoverEffect(x1, y1, x2, y2, r, color = "rgba(255, 235, 110, 0.3)") {
      const pulse = 0.22 + 0.1 * Math.sin(performance.now() * 0.008);
      drawRoundRect(x1, y1, x2, y2, r, color.replace("0.3", pulse.toFixed(2)), "#ffe875", 3);
    }

    function drawPillButton(x1, y1, x2, y2, label, bgCol, borderCol, isHover, fontPx = 18) {
      const r = (y2 - y1) / 2;
      drawRoundRect(x1 + 2, y1 + 4, x2 + 2, y2 + 4, r, "rgba(0,0,0,0.45)", null);
      drawRoundRect(x1, y1, x2, y2, r, isHover ? "#f59e0b" : bgCol, isHover ? "#fff3a1" : borderCol, 2.5);
      drawTextOutlined(label, (x1 + x2) / 2, (y1 + y2) / 2, fontPx, "#ffffff", "#0b2558");
    }

            drawRoundRect(b.x1, b.y1, b.x2, b.y2, 36, "rgba(46, 213, 115, 0.38)", "#7bed9f", 3.5);
          } else if (i === qz.selectedOption) {
            drawRoundRect(b.x1, b.y1, b.x2, b.y2, 36, "rgba(255, 71, 87, 0.38)", "#ff6b81", 3.5);
          }
        }

        const txtCol = (qz.answered && i === curQ.ans) ? "#a8ffb8" : "#ffffff";
        drawTextOutlined(curQ.options[i], cx, cy, 21, txtCol, "#0c2655");
      }

      drawWrappedText(qz.robotMsg, 700, 618, 575, 26, 20, qz.answered ? "#fff591" : "#ffffff", "#0c2655");

      if (qz.answered && !qz.finished) {
        const nextLbl = (qz.qIndex + 1 < city.questions.length) ? "Câu tiếp >>" : "Kết quả >>";
        drawPillButton(1020, 582, 1255, 652, nextLbl, "#f08214", "#fff08c", inBox(mx, my, 1020, 582, 1255, 652), 22);
      }

      if (qz.finished) {
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(0, 0, 1280, 720);
        drawRoundRect(280, 120, 1000, 600, 36, "rgba(16, 48, 110, 0.96)", "#ffe164", 3);

        const passed = qz.correctCount >= 4;
        drawTextOutlined(passed ? "HOÀN THÀNH XUẤT SẮC!" : "KẾT QUẢ NHIỆM VỤ", 640, 185, 34, "#fff078", "#782d05");
        drawTextOutlined(city.name, 640, 250, 26, "#8cf0ff", "#0a2350");
        drawTextOutlined(`Số câu trả lời đúng: ${qz.correctCount} / ${city.questions.length}`, 640, 305, 24, "#ffffff", "#0a2350");

        if (passed) {
          drawTextOutlined(`Phần thưởng: +${city.rewardStars} Sao   |   +${city.rewardXp} XP`, 640, 365, 22, "#ffeb6e", "#0a2350");
          drawTextOutlined(`Đã mở khóa: ${city.badgeName}!`, 640, 415, 22, "#78ff9b", "#0a2d19");
        } else {
          drawTextOutlined(`Phần thưởng khuyến khích: +${qz.correctCount * 3} Sao   |   +${qz.correctCount * 5} XP`, 640, 365, 22, "#ffeb6e", "#0a2350");
          drawTextOutlined("Hãy trả lời đúng ít nhất 4/5 câu để nhận Huy hiệu nhé!", 640, 415, 20, "#ffc88c", "#50190a");
        }

        drawPillButton(370, 495, 610, 560, "Chơi lại", "#1c64c3", "#82e6ff", inBox(mx, my, 370, 495, 610, 560), 23);
        drawPillButton(670, 495, 910, 560, "Về Bản đồ", "#f08214", "#fff082", inBox(mx, my, 670, 495, 910, 560), 23);
      }
    }

    // Vẽ các bảng Modal phụ (Thành tích, Kho báu Tri thức, Trợ lý AI, Quà tặng, Bảng xếp hạng, Trợ giúp, Cài đặt)
    function renderSecondaryModal() {
      if (!state.activeModal) return;
      const mx = state.mouseX, my = state.mouseY;

      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(0, 0, 1280, 720);
      drawRoundRect(160, 70, 1120, 655, 36, "rgba(14, 42, 98, 0.96)", "#5ad7ff", 3);
      drawRoundRect(180, 82, 1100, 148, 26, "#1c5cc3", null);
      drawPillButton(1035, 88, 1095, 142, "X", "#d73241", "#ffaaaa", inBox(mx, my, 1035, 88, 1095, 142), 20);

      if (state.activeModal === "achievements") {
        drawTextOutlined("BẢNG THÀNH TÍCH & HUY HIỆU", 640, 115, 30, "#fff082", "#0a2350");
        const doneCnt = state.cities.filter(c => c.completed).length;
        drawTextOutlined(`Cấp độ: Lv.${state.playerLevel}   |   Tổng Sao: ${state.playerStars}   |   Thành phố hoàn thành: ${doneCnt}/6`, 640, 175, 20, "#a0f0ff", "#0a1e46");

        for (let i = 0; i < 6; i++) {
          const col = i % 2, row = Math.floor(i / 2);
          const bx1 = 200 + col * 450, by1 = 210 + row * 115;
          const c = state.cities[i];
          drawRoundRect(bx1, by1, bx1 + 430, by1 + 100, 20, c.completed ? "#166955" : "#163a7d", c.completed ? "#6effa0" : "#50a5eb", 2);
          drawTextOutlined(c.badgeName, bx1 + 20, by1 + 34, 21, "#ffeb78", "#0a1e46", "left");
          const st = c.completed ? `Đã mở khóa! Điểm cao nhất: ${c.bestScore}/5` : `Chưa mở khóa - Hãy vượt qua ${c.name}`;
          drawTextOutlined(st, bx1 + 20, by1 + 68, 16, "#ffffff", "#0a1e46", "left");
        }
      } else if (state.activeModal === "treasure") {
        drawTextOutlined("KHO BÁU TRI THỨC 2065", 640, 115, 30, "#fff082", "#0a2350");
        const tc = state.cities[state.treasurePage];
        const tImg = images["thumb" + state.treasurePage];
        if (tImg) {
          ctx.drawImage(tImg, 210, 195, 396, 234);
          drawRoundRect(210, 195, 210 + 396, 195 + 234, 18, null, "#78e6ff", 2.5);
        }
        drawTextOutlined(tc.treasureTitle, 635, 220, 24, "#ffe66e", "#0a2350", "left");
        drawWrappedText(tc.treasureFact, 635, 330, 430, 32, 20, "#ffffff", "#0a2350", "left");

        drawPillButton(240, 495, 420, 548, "< Thẻ trước", "#1e5fbe", "#78dcff", inBox(mx, my, 240, 495, 420, 548), 19);
        drawTextOutlined(`Thẻ tri thức ${state.treasurePage + 1} / 6`, 640, 520, 20, "#b4f0ff", "#0a2350");
        drawPillButton(860, 495, 1040, 548, "Thẻ tiếp >", "#1e5fbe", "#78dcff", inBox(mx, my, 860, 495, 1040, 548), 19);
      } else if (state.activeModal === "ai_helper") {
        drawTextOutlined("TRỢ LÝ ROBOT AI TƯƠNG LAI", 640, 115, 30, "#fff082", "#0a2350");
        drawTextOutlined(`Xin chào ${state.playerName}! Mình là Robot AI 2065.`, 640, 200, 24, "#8cf5ff", "#0a2350");
        drawRoundRect(230, 245, 1050, 450, 28, "#144491", "#6ee1ff", 2.5);
        drawWrappedText(state.aiTips[state.aiTipIndex], 640, 348, 760, 36, 23, "#ffffff", "#0a2350");
        drawPillButton(460, 485, 820, 545, "Xem gợi ý tiếp theo >>", "#eb8719", "#ffeb82", inBox(mx, my, 460, 485, 820, 545), 21);
      } else if (state.activeModal === "gift") {
        drawTextOutlined("QUÀ TẶNG KHÁM PHÁ MỖI NGÀY", 640, 115, 30, "#fff082", "#0a2350");
        drawTextOutlined("Phần thưởng dành cho Nhà Khám Phá Chăm Chỉ:", 640, 230, 24, "#ffffff", "#0a2350");
        drawTextOutlined("+50 Ngôi sao Tri thức   &   +30 XP", 640, 320, 32, "#ffeb64", "#78320a");
        if (!state.dailyGiftClaimed) {
          drawPillButton(460, 440, 820, 515, "NHẬN QUÀ NGAY!", "#f08214", "#fff082", inBox(mx, my, 460, 440, 820, 515), 24);
        } else {
          drawTextOutlined("Bạn đã nhận quà hôm nay rồi! Hãy tiếp tục khám phá 6 thành phố nhé!", 640, 475, 22, "#82ffa0", "#0a2d19");
        }
      } else if (state.activeModal === "leaderboard") {
        drawTextOutlined("BẢNG XẾP HẠNG NHÀ KHÁM PHÁ", 640, 115, 30, "#fff082", "#0a2350");
        const leaders = [
          { name: "1. Lan Anh - Chuyên gia AI", stars: 260, lv: 4 },
          { name: "2. Hoàng Nam - Kiện tướng Toán", stars: 210, lv: 3 },
          { name: `3. ${state.playerName} (Bạn)`, stars: state.playerStars, lv: state.playerLevel, me: true },
          { name: "4. Bảo Ngọc - Đại sứ Xanh", stars: 110, lv: 1 },
          { name: "5. Quốc Khánh - Nhà Sử học trẻ", stars: 95, lv: 1 }
        ];
        for (let i = 0; i < 5; i++) {
          const ly = 195 + i * 72;
          const ld = leaders[i];
          drawRoundRect(240, ly, 1040, ly + 58, 18, ld.me ? "#2373c3" : "#143a7d", ld.me ? "#ffeb6e" : "#50aaf0", 2);
          drawTextOutlined(ld.name, 270, ly + 29, 21, ld.me ? "#fff582" : "#ffffff", "#0a1e46", "left");
          drawTextOutlined(`Lv.${ld.lv}  |  ${ld.stars} Sao`, 1010, ly + 29, 21, "#ffe664", "#0a1e46", "right");
        }
      } else if (state.activeModal === "help") {
        drawTextOutlined("HƯỚNG DẪN CHƠI GAME", 640, 115, 30, "#fff082", "#0a2350");
        const lines = [
          "1. Tại Sảnh nhân vật (Hub): Xem cấp độ, kinh nghiệm (XP), số Sao, mở Kho báu Tri thức",
          "   hoặc trò chuyện cùng Trợ lý Robot AI.",
          "2. Tại Bản đồ Thành phố: Nhấn vào bất kỳ đảo nào trong 6 Thành phố (Toán học, Ngôn ngữ,",
          "   Khoa học, Thành phố Xanh, Lịch sử - Văn hóa, Trung tâm AI) để mở Nhiệm vụ hôm nay.",
          "3. Tại Màn chơi Trắc nghiệm: Chọn đáp án đúng A, B, C, D trước khi hết 45 giây.",
          "   Trả lời đúng từ 4/5 câu để mở khóa trọn bộ Sao, XP và Huy hiệu Tri thức!"
        ];
        lines.forEach((ln, idx) => {
          drawTextOutlined(ln, 220, 215 + idx * 52, 20, "#ffffff", "#0a1e46", "left");
        });
      } else if (state.activeModal === "settings") {
        drawTextOutlined("CÀI ĐẶT HỆ THỐNG", 640, 115, 30, "#fff082", "#0a2350");
        drawPillButton(450, 260, 830, 320, "Âm thanh & Giọng đọc: " + (state.soundEnabled ? "BẬT" : "TẮT"), "#1c5fb9", "#78dcff", inBox(mx, my, 450, 260, 830, 320), 22);
        drawPillButton(450, 345, 830, 405, "Nhạc nền: " + (state.musicEnabled ? "BẬT" : "TẮT"), "#1c5fb9", "#78dcff", inBox(mx, my, 450, 345, 830, 405), 22);
        drawPillButton(450, 430, 830, 490, "Chế độ Toàn màn hình (Fullscreen)", "#1c5fb9", "#78dcff", inBox(mx, my, 450, 430, 830, 490), 22);
      }

      drawPillButton(530, 585, 750, 638, "Đóng", "#dc4b28", "#ffdc96", inBox(mx, my, 530, 585, 750, 638), 22);
    }

    // Xử lý sự kiện chuột trên Canvas 1280x720
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (1280 / rect.width),
        y: (e.clientY - rect.top) * (720 / rect.height)
      };
    }

    canvas.addEventListener("mousemove", e => {
      const pt = getCanvasCoords(e);
      state.mouseX = pt.x;
      state.mouseY = pt.y;
    });

    canvas.addEventListener("click", e => {
      const pt = getCanvasCoords(e);
      const mx = pt.x, my = pt.y;
      state.mouseX = mx;
      state.mouseY = my;

      // 1. Nếu đang mở Modal phụ
      if (state.activeModal) {
        if (inBox(mx, my, 1030, 82, 1105, 145) || inBox(mx, my, 530, 585, 750, 638)) {
          sfxClick();
          state.activeModal = "";
          return;
        }
        if (state.activeModal === "gift" && !state.dailyGiftClaimed && inBox(mx, my, 460, 440, 820, 515)) {
          sfxCorrect();
          state.dailyGiftClaimed = true;
          addRewards(50, 30);
          return;
        }
        if (state.activeModal === "ai_helper" && inBox(mx, my, 460, 485, 820, 545)) {
          sfxClick();
          state.aiTipIndex = (state.aiTipIndex + 1) % state.aiTips.length;
          speakVietnamese(state.aiTips[state.aiTipIndex]);
          return;
        }
        if (state.activeModal === "treasure") {
          if (inBox(mx, my, 240, 495, 420, 548)) {
            sfxClick();
            state.treasurePage = (state.treasurePage + 5) % 6;
            return;
          }
          if (inBox(mx, my, 860, 495, 1040, 548)) {
            sfxClick();
            state.treasurePage = (state.treasurePage + 1) % 6;
            return;
          }
        }
        if (state.activeModal === "settings") {
          if (inBox(mx, my, 450, 260, 830, 320)) { toggleSound(); return; }
          if (inBox(mx, my, 450, 345, 830, 405)) { sfxClick(); state.musicEnabled = !state.musicEnabled; return; }
          if (inBox(mx, my, 450, 430, 830, 490)) { sfxClick(); toggleFullScreen(); return; }
        }
        return;
      }

      // 2. Nếu đang mở Popup Nhiệm vụ hôm nay (Screen 4)
      if (state.showMissionPopup) {
        if (Math.hypot(mx - 1188, my - 92) <= 48) {
          sfxClick();
          state.showMissionPopup = false;
          updateTopbarButtons();
          return;
        }
        if (inBox(mx, my, 1055, 162, 1105, 208)) {
          sfxClick();
          state.selectedCity = (state.selectedCity + 5) % 6;
          return;
        }
        if (inBox(mx, my, 1112, 162, 1162, 208)) {
          sfxClick();
          state.selectedCity = (state.selectedCity + 1) % 6;
          return;
        }
        if (inBox(mx, my, 776, 552, 1174, 646)) {
          sfxCorrect();
          state.showMissionPopup = false;
          switchScreen("quiz");
          return;
        }
        return;
      }

      // 3. Tương tác theo từng màn hình
      if (state.screen === "menu") {
        if (inBox(mx, my, 816, 376, 1244, 478)) { switchScreen("hub"); return; }
        if (inBox(mx, my, 930, 490, 1188, 558)) { sfxClick(); state.activeModal = "achievements"; return; }
        if (inBox(mx, my, 930, 562, 1188, 630)) { sfxClick(); state.activeModal = "settings"; return; }
        if (inBox(mx, my, 930, 634, 1188, 702)) { sfxClick(); alert("Cảm ơn bạn đã trải nghiệm Thành phố Tri thức 2065!"); return; }
        if (inBox(mx, my, 1045, 18, 1262, 66))   { switchScreen("map"); return; }
      } else if (state.screen === "hub") {
        if (inBox(mx, my, 896, 120, 1268, 238)) { sfxClick(); state.showMissionPopup = true; updateTopbarButtons(); return; }
        if (inBox(mx, my, 896, 246, 1268, 360)) { sfxClick(); state.activeModal = "treasure"; return; }
        if (inBox(mx, my, 896, 368, 1268, 482)) { sfxClick(); state.activeModal = "achievements"; return; }
        if (inBox(mx, my, 896, 490, 1268, 604)) { sfxClick(); state.activeModal = "ai_helper"; speakVietnamese(state.aiTips[state.aiTipIndex]); return; }
        if (inBox(mx, my, 42, 578, 758, 692)) {
          sfxClick();
          state.hubSpeechIndex = (state.hubSpeechIndex + 1) % state.hubSpeeches.length;
          speakVietnamese(state.hubSpeeches[state.hubSpeechIndex]);
          return;
        }
        if (inBox(mx, my, 1170, 18, 1248, 82))  { sfxClick(); state.activeModal = "gift"; return; }
        if (inBox(mx, my, 780, 618, 1264, 692)) { switchScreen("map"); return; }
        if (inBox(mx, my, 730, 20, 915, 76))    { switchScreen("menu"); return; }
      } else if (state.screen === "map") {
        if (inBox(mx, my, 18, 8, 158, 138) || inBox(mx, my, 415, 18, 615, 70)) { switchScreen("hub"); return; }
        if (inBox(mx, my, 295, 65, 345, 108) || inBox(mx, my, 876, 8, 986, 110)) { sfxClick(); state.activeModal = "gift"; return; }
        if (inBox(mx, my, 994, 8, 1142, 110))  { sfxClick(); state.activeModal = "leaderboard"; return; }
        if (inBox(mx, my, 1150, 8, 1258, 110)) { sfxClick(); state.activeModal = "help"; return; }

        for (let i = 0; i < 6; i++) {
          const isl = islands[i];
          if (inBox(mx, my, isl.x1, isl.y1, isl.x2, isl.y2)) {
            sfxClick();
            state.selectedCity = i;
            state.showMissionPopup = true;
            updateTopbarButtons();
            return;
          }
        }
      } else if (state.screen === "quiz") {
        if (inBox(mx, my, 18, 12, 142, 62)) { switchScreen("map"); return; }

        const city = state.cities[state.selectedCity];
        const qz = state.quiz;

        if (qz.finished) {
          if (inBox(mx, my, 370, 495, 610, 560)) { sfxClick(); resetQuiz(); return; }
          if (inBox(mx, my, 670, 495, 910, 560)) { switchScreen("map"); return; }
          return;
        }

        if (!qz.answered) {
          const curQ = city.questions[qz.qIndex];
          for (let i = 0; i < 4; i++) {
            const b = quizBoxes[i];
            if (inBox(mx, my, b.x1, b.y1, b.x2, b.y2)) {
              qz.selectedOption = i;
              qz.answered = true;
              if (i === curQ.ans) {
                sfxCorrect();
                qz.correctCount++;
                addRewards(5, 5);
                qz.robotMsg = curQ.explain;
              } else {
                sfxWrong();
                qz.robotMsg = "Chưa chính xác! " + curQ.explain;
              }
              speakVietnamese(qz.robotMsg);
              return;
            }
          }
        } else {
          if (inBox(mx, my, 1020, 582, 1255, 652) || inBox(mx, my, 388, 568, 1012, 668)) {
            sfxClick();
            if (qz.qIndex + 1 < city.questions.length) {
              qz.qIndex++;
              qz.selectedOption = -1;
              qz.answered = false;
              qz.timeLeft = 45.0;
              qz.robotMsg = "Hãy chọn đáp án đúng nhé!";
            } else {
              qz.finished = true;
              if (!qz.rewardGranted) {
                qz.rewardGranted = true;
                if (qz.correctCount > city.bestScore) city.bestScore = qz.correctCount;
                if (qz.correctCount >= 4) {
                  city.completed = true;
                  addRewards(city.rewardStars, city.rewardXp);
                  sfxCorrect();
                } else {
                  addRewards(qz.correctCount * 3, qz.correctCount * 5);
                }
              }
            }
            return;
          }
        }
      }
    });

    // Vòng lặp thời gian & render 60 FPS
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (state.screen === "quiz" && !state.quiz.answered && !state.quiz.finished) {
        state.quiz.timeLeft -= dt;
        if (state.quiz.timeLeft <= 0) {
          state.quiz.timeLeft = 0;
          state.quiz.answered = true;
          state.quiz.selectedOption = -1;
          const curQ = state.cities[state.selectedCity].questions[state.quiz.qIndex];
          state.quiz.robotMsg = "Hết giờ rồi! " + curQ.explain;
          sfxWrong();
        }
      }

      ctx.clearRect(0, 0, 1280, 720);
      if (loadedCount < totalImages) {
        drawTextOutlined("Đang tải tài nguyên Thành phố Tri thức 2065...", 640, 360, 28, "#ffffff", "#0b2454");
      } else {
        if (state.screen === "menu") renderMenu();
        else if (state.screen === "hub") renderHub();
        else if (state.screen === "map") renderMap();
        else if (state.screen === "quiz") renderQuiz();

        renderMissionPopup();
        renderSecondaryModal();
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
